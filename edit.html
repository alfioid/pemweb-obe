<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data - Dashboard Admin</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigasi Kiri -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="index.html" class="menu-item" title="Beranda">🏠</a>
                <a href="kost.html" class="menu-item" title="Manajemen Kost">🛏️</a>
                <a href="penghuni.html" class="menu-item" title="Data Penghuni">👥</a>
                <a href="uang.html" class="menu-item" title="Keuangan">💰</a>
                <a href="form.html" class="menu-item" title="Form Pendaftaran">📝</a>
                <a href="edit.html" class="menu-item active" title="Pengaturan Data">⚙️</a>
            </nav>
        </aside>

        <!-- Area Utama -->
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Update Data</h1>
            </div>

            <!-- Form Edit Data -->
           <div class="card-dashboard form-card">
                <h2 class="form-heading">Pengeditan Data Kamar & Penghuni</h2>
                <form id="form-edit">
                    <div class="stats-row form-grid">
                        <div>
                            <label class="form-label">Foto Kamar (Bisa Edit):</label>
                            <input type="file" class="form-input form-input--file">
                        </div>
                        <div>
                            <label class="form-label">Informasi Penghuni:</label>
                            <input type="text" class="form-input" placeholder="Nama Penghuni">
                        </div>
                    </div>

                    <div class="form-field">
                        <label class="form-label">Masukkan Uang Terbaru (Transaksi):</label>
                        <input type="number" class="form-input" placeholder="Nominal Rp">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-pill btn-pill--primary">Simpan</button>
                        <button type="button" class="btn-pill btn-pill--danger">Hapus</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
