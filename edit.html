<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data - Dashboard Admin</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigasi Kiri -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="index.html" class="menu-item" title="Beranda">🏠</a>
                <a href="kost.html" class="menu-item" title="Manajemen Kost">🛏️</a>
                <a href="penghuni.html" class="menu-item" title="Data Penghuni">👥</a>
                <a href="uang.html" class="menu-item" title="Keuangan">💰</a>
                <a href="edit.html" class="menu-item active" title="Pengaturan Data">⚙️</a>
            </nav>
        </aside>

        <!-- Area Utama -->
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Update Data</h1>
            </div>

            <!-- Form Edit Data -->
            <div class="card-dashboard" style="max-width: 800px;">
                <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Pengeditan Data Kamar & Penghuni</h2>
                <form id="form-edit">
                    <div class="stats-row" style="grid-template-columns: 1fr 1fr; margin-bottom: 1.5rem;">
                        <div>
                            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Foto Kamar (Bisa Edit):</label>
                            <input type="file" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 8px;">
                        </div>
                        <div>
                            <label style="font-weight: 600; display: block; margin-bottom: 6px;">Informasi Penghuni:</label>
                            <input type="text" placeholder="Nama Penghuni" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; outline: none;">
                        </div>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="font-weight: 600; display: block; margin-bottom: 6px;">Masukkan Uang Terbaru (Transaksi):</label>
                        <input type="number" placeholder="Nominal Rp" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; outline: none;">
                    </div>

                    <div style="display: flex; gap: 12px;">
                        <button type="button" class="btn-pill" style="background-color: var(--color-primary); border: none; cursor: pointer; padding: 10px 24px;">Simpan</button>
                        <button type="button" class="btn-pill" style="background-color: #e53e3e; border: none; cursor: pointer; padding: 10px 24px;">Hapus</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
