<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Keuangan - Dashboard Admin</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigasi Kiri -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="index.html" class="menu-item" title="Beranda">🏠</a>
                <a href="kost.html" class="menu-item" title="Manajemen Kost">🛏️</a>
                <a href="penghuni.html" class="menu-item" title="Data Penghuni">👥</a>
                <a href="uang.html" class="menu-item active" title="Keuangan">💰</a>
                <a href="form.html" class="menu-item" title="Form Pendaftaran">📝</a>
                <a href="edit.html" class="menu-item" title="Pengaturan Data">⚙️</a>
            </nav>
        </aside>

        <!-- Area Utama -->
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Keuangan</h1>
            </div>

            <!-- Ringkasan Total Uang -->
            <div class="card-dashboard finance-summary">
                <h2 id="total-uang-text">Total Uang: Rp 1.300.000</h2>
            </div>

            <!-- Grid Uang Masuk & Uang Keluar -->
            <div class="stats-row">
                <div class="card-dashboard">
                    <h3 class="section-title section-title--primary">Uang Masuk</h3>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Keterangan</th>
                                    <th>Jumlah</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-uang-masuk"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card-dashboard">
                    <h3 class="section-title section-title--accent">Uang Keluar</h3>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Keterangan</th>
                                    <th>Jumlah</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-uang-keluar"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
